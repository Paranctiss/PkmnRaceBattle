<div class="commands">
  <div class="moves">
    <div class="move-wrap"
         *ngFor="let move of PokemonMoves"
         (mouseenter)="onMouseEnter(move)"
         (mouseleave)="onMouseLeave(move)">
      <button type="button"
              class="move"
              [disabled]="isDisabled(move)"
              [style.--move-color]="typeColor(move)"
              [style.--move-text]="typeText(move)"
              (click)="useMove(move)">
        <span class="move__name">{{ move.nameFr }}</span>
        <span class="move__meta">
          <span class="move__type">{{ typeLabel(move) }}</span>
          <span class="move__pp">PP {{ pp(move) }}</span>
        </span>
      </button>

      <div *ngIf="move.isHovered" class="move-info frame frame--dark">
        <h4 class="move-info__title">{{ move.nameFr }}</h4>
        <p class="move-info__text">{{ move.flavorText }}</p>
        <dl class="move-info__stats">
          <div><dt>Catégorie</dt><dd>{{ damageTypeLabel(move) }}</dd></div>
          <div><dt>Puissance</dt><dd>{{ move.power || '—' }}</dd></div>
          <div><dt>Précision</dt><dd>{{ move.accuracy ? move.accuracy + ' %' : '—' }}</dd></div>
        </dl>
      </div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="action" (click)="openBagDialog()" (mouseenter)="bagHovered = true" (mouseleave)="bagHovered = false">
      <img class="pixel action__icon" [src]="bagHovered ? 'assets/items-sprites/Sac_Open.png' : 'assets/items-sprites/Sac.png'" alt="">
      <span>Sac</span>
    </button>
    <button type="button" class="action" (click)="openReplacePokemon()">
      <app-pixel-icon name="Ball" [size]="30"/>
      <span>Pokémon</span>
    </button>
    <button type="button" class="action" (click)="OpenMap()">
      <img class="pixel action__icon" src="assets/items-sprites/map.png" alt="">
      <span>Carte</span>
    </button>
  </div>
</div>
