<div class="battle">
  <!-- ===== Scène ===== -->
  <div class="stage">
    <!-- Adversaire : encadré à gauche du Pokémon, plateforme calée sur l'horizon -->
    <div class="side side--foe">
      <app-battle-hud class="hud-slot--foe"
                      side="foe"
                      [battler]="OppositePokemon"
                      [level]="OppositePokemon.level"
                      [trainerTeam]="Opponent.isTrainer ? Opponent.team : undefined"/>

      <div class="spot spot--foe">
        <img *ngIf="Opponent.isTrainer" appGroundedSprite class="foe-trainer pixel" src="assets/trainers-sprites/{{ Opponent.sprite }}.png" [alt]="Opponent.name">
        <div class="platform"></div>
        <img *ngIf="catchingBall === '' && OppositePokemon.untargetable == null"
             appGroundedSprite
             class="sprite sprite--foe pixel"
             [src]="OppositePokemon.frontSprite"
             [alt]="OppositePokemon.nameFr">
        <img *ngIf="catchingBall !== ''" class="ballImg" src="/assets/balls-sprites/{{ catchingBall }}.webp" [alt]="catchingBall">
      </div>
    </div>

    <!-- Joueur : encadré à droite du Pokémon -->
    <div class="side side--ally">
      <div class="spot spot--ally">
        <div class="platform"></div>
        <img *ngIf="allyVisible" appGroundedSprite class="sprite sprite--ally pixel" [src]="allyBattler.backSprite" [alt]="allyBattler.nameFr">
      </div>

      <app-battle-hud class="hud-slot--ally"
                      side="ally"
                      [battler]="allyBattler"
                      [level]="PlayerPokemon.level"
                      [expPokemon]="PlayerPokemon"/>
    </div>
  </div>

  <!-- ===== Dialogue + commandes ===== -->
  <div class="console" [class.console--wide]="!hasCommandPanel">
    <div class="dialog frame">
      <!-- Recréé à chaque nouveau texte pour rejouer l'effet "machine à écrire" -->
      <p class="dialog__text" *ngFor="let text of [dialogText]" [class.is-message]="currentMessage">{{ text }}</p>
      <span class="dialog__arrow blink" *ngIf="currentMessage" aria-hidden="true">▼</span>
      <button type="button" class="dialog__log-toggle" (click)="showLog = !showLog" [attr.aria-expanded]="showLog">
        Journal <span>{{ showLog ? '▾' : '▴' }}</span>
      </button>
      <ol class="log frame frame--dark" *ngIf="showLog" aria-label="Journal du combat">
        <li *ngFor="let item of logs">{{ item }}</li>
        <li *ngIf="logs.length === 0">Rien à signaler pour l’instant.</li>
      </ol>
    </div>

    <div class="command-panel" *ngIf="canAct">
      <app-pokemon-moves
        [PokemonMoves]="PlayerPokemon.moves"
        [DisabledMoves]="PlayerPokemon.cantUseMoves"
        (PokemonMovesChange)="useMove($event)"
        (OpenedBag)="openBagDialog()"
        (ChangePokemon)="openReplacePokemon = true"
        (OpenMapEmitter)="OpenMap()"/>
    </div>

    <div class="command-panel command-panel--single" *ngIf="PlayerPokemon.waitingMove != null && !hubService.pending">
      <button type="button" class="btn btn--primary btn--lg" (click)="useMove(PlayerPokemon.waitingMove!)">
        Continuer : {{ PlayerPokemon.waitingMove!.nameFr }} ▶
      </button>
    </div>
  </div>
</div>

<!-- ===== Fenêtres ===== -->

<app-game-modal *ngIf="openReplacePokemon" [title]="replaceTitle" accent="red" (closed)="CloseReplacePokemon()">
  <p class="modal-lead">{{ replaceHint }}</p>
  <div class="party-grid">
    <button type="button"
            class="party-pick"
            *ngFor="let pokemon of hubService.Player.team; let i = index"
            (click)="replacePokemon(pokemon, i)">
      <app-pokemon-slot [pokemon]="pokemon" [lead]="i === 0" [dimmed]="!canEvolveWithItem(pokemon, itemToUse)" [showTypes]="true"/>
    </button>
  </div>
</app-game-modal>

<app-game-modal *ngIf="openBag" title="Sac" accent="gold" (closed)="openBag = false">
  <app-bag [items]="hubService.Player.items" (itemSelected)="itemClicked($event)"/>
</app-game-modal>

<app-game-modal *ngIf="openLearnMove && pokemonWantToLearn.length > 0" title="Nouvelle capacité" accent="gold" size="sm" [closable]="false">
  <p class="modal-lead">
    <b>{{ pokemonWantToLearn[0].nameFr }}</b> veut apprendre <b>{{ movesToLearn[0][0].nameFr }}</b>,
    mais il connaît déjà quatre capacités. Laquelle doit-il oublier ?
  </p>
  <div class="learn-list">
    <button type="button"
            *ngFor="let move of pokemonWantToLearn[0].moves"
            class="btn btn--block menu-cursor learn-list__move"
            [style.--btn-bg]="typeColor(move.type)"
            [style.--btn-fg]="typeText(move.type)"
            (click)="ReplaceMoveBy(move.id, movesToLearn[0][0].id, pokemonWantToLearn[0].id)">
      {{ move.nameFr }}
    </button>
  </div>
  <button type="button" class="btn btn--sm btn--dark btn--block" (click)="DismissLearn()">
    Ne pas apprendre {{ movesToLearn[0][0].nameFr }}
  </button>
</app-game-modal>

<app-game-modal *ngIf="openMap" title="Carte de la région" size="lg" (closed)="CloseMap()">
  <app-map
    [PathNodes]="hubService.Player.playerPath.pathPoints"
    [CurrentNode]="hubService.Player.currentPath"
    [TrainerSprite]="hubService.Player.sprite"/>
</app-game-modal>
