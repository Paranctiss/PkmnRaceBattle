<section class="mart frame frame--mart">
  <header class="mart__sign">
    <app-pixel-icon name="Shop" [size]="44"/>
    <span class="mart__sign-text">Boutique Pokémon</span>
    <span class="chip wallet" title="Pokédollars">₽ {{ hubService.Player.credits }}</span>
  </header>

  <div class="mart__tabs" role="tablist" aria-label="Rayons">
    <button type="button"
            role="tab"
            *ngFor="let pocket of pockets"
            class="mart__tab"
            [class.is-active]="pocket.key === activePocket"
            [attr.aria-selected]="pocket.key === activePocket"
            (click)="activePocket = pocket.key">
      {{ pocket.label }}
    </button>
  </div>

  <div class="mart__shelf" role="tabpanel">
    <button type="button"
            *ngFor="let item of shelfItems"
            class="ware"
            [class.is-unaffordable]="hubService.Player.credits < item.price"
            [attr.aria-disabled]="hubService.Player.credits < item.price"
            (click)="buyItem(item)"
            (mouseenter)="hovered = item"
            (mouseleave)="hovered = undefined">
      <span class="ware__owned" *ngIf="owned(item.name) > 0">×{{ owned(item.name) }}</span>
      <img class="ware__sprite" [src]="sprite(item.name)" [alt]="item.name">
      <span class="ware__name">{{ item.name }}</span>
      <span class="ware__price">₽ {{ item.price }}</span>
    </button>
  </div>

  <footer class="mart__footer">
    <p class="mart__clerk" [class.is-purchase]="currentMessage">{{ clerkText }}</p>
    <div class="mart__actions">
      <button type="button" class="btn btn--sm" (click)="openBag = true">
        <img class="btn__icon pixel" src="assets/items-sprites/Sac.png" alt="">
        Sac
      </button>
      <button type="button" class="btn btn--blue" [disabled]="leaving" (click)="nextTurn()">
        <app-pixel-icon name="Exit" [size]="24"/>
        Quitter
      </button>
    </div>
  </footer>
</section>

<app-game-modal *ngIf="openBag" title="Sac" accent="gold" (closed)="openBag = false">
  <app-bag [items]="hubService.Player.items" [selectable]="false"/>
</app-game-modal>
