<section class="team frame frame--dark">
  <h2 class="frame-title">Équipe {{ Team.length }}/6</h2>
  <div class="team__slots">
    <app-pokemon-slot *ngFor="let pokemon of Team; let i = index" [pokemon]="pokemon" [lead]="i === 0" [compact]="true"/>
    <div class="team__empty" *ngFor="let slot of emptySlots" aria-hidden="true">
      <span class="team__empty-ball"></span>
    </div>
  </div>
</section>
