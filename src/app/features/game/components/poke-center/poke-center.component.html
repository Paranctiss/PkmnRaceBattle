<section class="center frame frame--center">
  <header class="center__sign">
    <app-pixel-icon name="Centre" [size]="44"/>
    <span>Centre Pokémon</span>
    <app-pixel-icon name="Centre" [size]="44"/>
  </header>

  <p class="center__dialog">
    {{ healed
      ? 'Vos Pokémon sont en pleine forme ! À bientôt !'
      : 'Bienvenue au Centre Pokémon ! Voulez-vous que je soigne vos Pokémon ?' }}
  </p>

  <div class="center__team" [class.is-healed]="healed">
    <app-pokemon-slot *ngFor="let pkmn of hubService.Player.team; let i = index" [pokemon]="pkmn" [lead]="i === 0"/>
  </div>

  <div class="center__actions">
    <button type="button" class="btn btn--center btn--lg" *ngIf="!healed" [disabled]="hubService.pending" (click)="usePokeCenter()">
      {{ hubService.pending ? 'Soins en cours…' : 'Soigner l’équipe' }}
    </button>
    <button type="button" class="btn btn--primary btn--lg" *ngIf="healed" [disabled]="hubService.pending" (click)="nextTurn()">
      Reprendre la route ▶
    </button>
  </div>
</section>
