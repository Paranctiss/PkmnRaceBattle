<main class="page">
  <header class="page__bar">
    <button type="button" class="btn btn--sm" routerLink="/">◀ Accueil</button>
    <span class="chip">{{ Host ? 'Nouvelle partie' : 'Rejoindre une partie' }}</span>
  </header>

  <section class="intro">
    <h1 class="page-title">Choisis ton partenaire</h1>
    <p class="page-sub">Il t’accompagnera tout au long de la course.</p>
  </section>

  <section class="starters" role="radiogroup" aria-label="Pokémon de départ">
    <ng-container *ngFor="let pokemon of Starters">
      <app-starter-card
        *ngIf="pokemon.types !== undefined"
        (click)="selectPokemonId(pokemon.id)"
        [Pokemon]="pokemon"
        [selectedPokemonId]="selectedPokemonId"/>
    </ng-container>
    <div class="starters__loading" *ngIf="Starters.length === 0">
      <span class="ball-loader"></span>
      <span>Ouverture des Poké Balls…</span>
    </div>
  </section>

  <section class="trainer-card frame frame--red">
    <h2 class="frame-title">Carte Dresseur</h2>
    <div class="trainer-card__fields">
      <label class="field">
        <span class="field__label">Nom</span>
        <input class="input" [(ngModel)]="username" type="text" maxlength="16" placeholder="Ton pseudo" autocomplete="off"/>
      </label>
      <label class="field" *ngIf="!Host">
        <span class="field__label">Code de la salle</span>
        <input class="input input--code" [(ngModel)]="roomCode" type="text" maxlength="6" placeholder="A1B2C3" autocomplete="off"/>
      </label>
      <p class="trainer-card__partner">
        Partenaire :
        <b *ngIf="selectedStarter; else noPartner">{{ selectedStarter.nameFr }}</b>
        <ng-template #noPartner><i>aucun pour l’instant</i></ng-template>
      </p>
    </div>
    <div class="trainer-card__photo">
      <div class="photo">
        <img class="pixel" src="/assets/trainers-sprites/{{ trainerSprite }}.png" alt="Apparence du dresseur">
      </div>
      <button type="button" class="btn btn--sm" (click)="changeTrainerSprite()">↻ Changer</button>
    </div>
  </section>

  <footer class="cta">
    <button type="button" class="btn btn--primary btn--lg" [disabled]="!!missingHint" (click)="submit()">
      {{ Host ? 'Créer la partie' : 'Rejoindre la partie' }} ▶
    </button>
    <p class="cta__hint" *ngIf="missingHint">{{ missingHint }}</p>
  </footer>
</main>
